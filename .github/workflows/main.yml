name: infrastructure

on:
  push:
    branches:
      - "main"
      - "master"
      - "dev"
    paths-ignore:
      - "**/README.md"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v7
      - name: "Generate secrets"
        run: make init
      - name: "Check: compose files, access of the websites, Dockerfiles, Caddyfile"
        run: make check
