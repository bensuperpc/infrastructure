services:
  service-base:
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Paris}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - SYS_ADMIN

  backup-base:
    extends:
      service: service-base
    image: mazzolino/restic:1.8.2
    env_file:
      - ./backup.env
    network_mode: none
    cap_drop:
      - NET_ADMIN
      - NET_RAW

  postgres-base:
    extends:
      service: service-base
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s
