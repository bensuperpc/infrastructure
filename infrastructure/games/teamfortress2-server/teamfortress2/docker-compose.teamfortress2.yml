services:
  # Team Fortress 2 server
  teamfortress2_server:
    extends:
      file: ../../../common.yml
      service: service-base
    image: cm2network/tf2:sourcemod-x64@sha256:5b24ddb507bfdd55e238c2c22363232e3903679cf401730c11c0b79fc898ac39
    container_name: teamfortress2_server
    profiles: [teamfortress2]
    ports:
     - "${LISTEN_ADDRESS:-0.0.0.0}:27015:27015/tcp"
     - "${LISTEN_ADDRESS:-0.0.0.0}:27015:27015/udp"
    volumes:
      - teamfortress2_data:/home/steam/tf-dedicated
    networks:
      - teamfortress2
    env_file:
      - ./teamfortress2.env
#    environment:
#      - PUID=${PUID:-1000}
#      - PGID=${PGID:-1000}

volumes:
  teamfortress2_backup: { name: teamfortress2_backup }
  teamfortress2_data: { name: teamfortress2_data }

networks:
  teamfortress2: {}
