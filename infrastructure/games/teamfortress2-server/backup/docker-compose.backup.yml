services:
  teamfortress2_backup:
    container_name: teamfortress2_backup
    profiles: [teamfortress2_backup]
    extends:
      file: ../../../common.yml
      service: backup-base
    depends_on:
      - teamfortress2_server
    env_file:
      - ./teamfortress2_backup.env
    volumes:
      - teamfortress2_backup:/mnt/restic
      - teamfortress2_data:/data:ro
