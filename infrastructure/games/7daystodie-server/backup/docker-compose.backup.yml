services:
  7daystodie_backup:
    container_name: 7daystodie_backup
    profiles: [7daystodie]
    extends:
      file: ../../../common.yml
      service: backup-base
    depends_on:
      - 7daystodie_server
    env_file:
      - ./7daystodie_backup.env
    volumes:
      - 7daystodie_backup:/mnt/restic
      - 7daystodie_server_save:/data:ro
