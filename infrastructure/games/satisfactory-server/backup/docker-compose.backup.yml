services:
  satisfactory_backup:
    container_name: satisfactory_backup
    profiles: [satisfactory]
    extends:
      file: ../../../common.yml
      service: backup-base
    depends_on:
      - satisfactory_server
    env_file:
      - ./satisfactory_backup.env
    volumes:
      - satisfactory_backup:/mnt/restic
      - satisfactory_server_config:/data:ro
