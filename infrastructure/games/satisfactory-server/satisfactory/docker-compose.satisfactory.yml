services:
  # Satisfactory server
  satisfactory_server:
    extends:
      file: ../../../common.yml
      service: service-base
    image: wolveix/satisfactory-server:v1.10.0
    container_name: satisfactory_server
    profiles: [satisfactory]
    labels:
      homepage.group: Games
      homepage.name: satisfactory
      homepage.weight: "30"
      homepage.icon: satisfactory.png
      homepage.description: Satisfactory server
    ports:
      - ${LISTEN_ADDRESS:-0.0.0.0}:7777:7777/udp
      - ${LISTEN_ADDRESS:-0.0.0.0}:7777:7777/tcp
      - ${LISTEN_ADDRESS:-0.0.0.0}:8888:8888/tcp
    volumes:
      - satisfactory_server_config:/config
    networks:
      - satisfactory
    env_file:
      - ./satisfactory.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    healthcheck:
      test: bash /healthcheck.sh
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  satisfactory_backup: { name: satisfactory_backup }
  satisfactory_server_config: { name: satisfactory_server_config }

networks:
  satisfactory: {}
