services:
  # Satisfactory server
  satisfactory_server:
    extends:
      file: ../../../common.yml
      service: service-base
    image: wolveix/satisfactory-server:${SATISFACTORY_DOCKER_TAG:-latest}
    container_name: satisfactory_server
    profiles:
      - satisfactory_server
    ports:
      - 7777:7777/udp
      - 7777:7777/tcp
      - 8888:8888/tcp
    volumes:
      - satisfactory_server_config:/config
    networks:
      - satisfactory-network
    env_file:
      - ./env/satisfactory.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    healthcheck:
      test: bash /healthcheck.sh
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  satisfactory_server_config:
    name: satisfactory_server_config

networks:
  satisfactory-network:
    driver: bridge
    name: satisfactory-network
