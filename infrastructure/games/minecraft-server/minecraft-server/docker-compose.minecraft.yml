services:
  minecraft_proxy:
    image: itzg/mc-proxy:2026.11.2-java25
    container_name: minecraft_proxy_server
    profiles: [minecraft]
    restart: on-failure:7
    env_file:
      - ./proxy.env
    environment:
      INIT_MEMORY: "512M"
      MAX_MEMORY: "2048M"
    ports:
      #       Server Minecraft port
      - "${LISTEN_ADDRESS:-0.0.0.0}:25565:25577"
      #       Server Minecraft Bedrock port (GeyserMC)
      #- "19132:19132/udp"
      #       Rcon port
      #- "25576:25575"
      #       Plan port
      # - "8806:8804"
    volumes:
      - minecraft_proxy_data:/server
    networks:
      - minecraft

  mc-server:
    image: itzg/minecraft-server:2026.11.1-java25
    container_name: minecraft_server
    profiles: [minecraft]
    labels:
      homepage.group: Games
      homepage.name: minecraft
      homepage.weight: "10"
      homepage.icon: minecraft.png
      homepage.description: Minecraft server
    depends_on:
      - minecraft_proxy
    restart: on-failure:7
    ports:
      #       Server Minecraft port (Disable if you use proxy)
      # - "25565:25565"
      #       Rcon port
      # - "25575:25575"
      #       Server Minecraft Bedrock port (GeyserMC)
      # - "19132:19132/udp"
      #       Dynmap port
      # - "8123:8123"
      #       BlueMap port
      - "${LISTEN_ADDRESS:-0.0.0.0}:8100:8100"
      #       Plan port
      - "${LISTEN_ADDRESS:-0.0.0.0}:8804:8804"
    env_file:
      - ./server.env
      - ./world.env
      - ./mods_plugins.env
    environment:
      MAX_MEMORY: "${MAX_MEMORY:-24G}"
    volumes:
      - minecraft_server_data:/data
    networks:
      - minecraft
#      - ./asset_links/plugins.txt:/extras/plugins.txt:ro

volumes:
  minecraft_server_backup: { name: minecraft_server_backup }
  minecraft_server_data: { name: minecraft_server_data }
  minecraft_proxy_data: { name: minecraft_proxy_data }

networks:
  minecraft: {}
