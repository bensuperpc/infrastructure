services:
  minecraft_backup:
    container_name: minecraft_backup
    profiles: [minecraft]
    extends:
      file: ../../../common.yml
      service: backup-base
    depends_on:
      - mc-server
      - minecraft_proxy
    env_file:
      - ./backup.env
    volumes:
      - minecraft_server_backup:/mnt/restic
      - minecraft_server_data:/data/minecraft_server_data:ro
      - minecraft_proxy_data:/data/minecraft_proxy_data:ro
