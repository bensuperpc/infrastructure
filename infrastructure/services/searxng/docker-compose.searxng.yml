services:
  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:${SEARXNG_DOCKER_TAG:-2026.11.15-2d500cb6b}
    profiles:
      - searxng
      - local_ai
    extends:
      file: ../../common.yml
      service: service-base
    env_file:
      - ./searxng.env
    networks:
      - caddy-tools
      - searxng-internal
    volumes:
      - ./config/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng/
    dns:
      - 1.1.1.1
      - 8.8.8.8

  mcp-searxng:
    image: isokoliuk/mcp-searxng:${MCP_SEARXNG_DOCKER_TAG:-2.10.1}
    container_name: mcp-searxng
    profiles:
      - local_ai
    extends:
      file: ../../common.yml
      service: service-base
    depends_on:
      - searxng
    env_file:
      - ./mcp-searxng.env
    networks:
      - local-ai
      - searxng-internal
    healthcheck:
      test: [CMD, node, -e, "Promise.all(['http://127.0.0.1:3000/health', 'http://searxng:8080/healthz'].map(u => fetch(u).then(r => r.ok || Promise.reject()))).then(() => process.exit(0), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s

networks:
  caddy-tools:
    driver: bridge
    name: caddy-tools
  searxng-internal:
    driver: bridge
    name: searxng-internal
  local-ai:
    driver: bridge
    name: local-ai
    internal: true

volumes:
  searxng-data: {}
