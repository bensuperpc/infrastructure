name: searxng

services:
  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    depends_on:
      - caddy
    profiles:
      - searxng
    extends:
      file: ../../common.yml
      service: service-base
    env_file: ./config/searxng.env
    networks:
      - caddy-tools
      - searxng-internal
    volumes:
      - searxng-config:/etc/searxng/
      - searxng-data:/var/cache/searxng/
    dns:
      - 1.1.1.1
      - 8.8.8.8

  searxng-valkey:
    container_name: searxng-valkey
    profiles:
      - searxng
    image: docker.io/valkey/valkey:${SEARXNG_VALKEY_DOCKER_TAG:-9-alpine}
    extends:
      file: ../../common.yml
      service: service-base
    command: valkey-server --save 30 1 --loglevel warning
    networks:
      - searxng-internal
    volumes:
      - searxng-valkey-data:/data/

networks:
  caddy-tools:
    driver: bridge
    name: caddy-tools
  searxng-internal:
    driver: bridge
    name: searxng-internal

volumes:
  searxng-data: {}
  searxng-config: {}
  searxng-valkey-data: {}

