services:
  # VS Code in the browser, with the same tools as opencode; drives dind
  vscode-server:
    build:
      context: ../../images/dev
      target: code-server
      args:
        HOST_UID: ${PUID:-1000}
        HOST_GID: ${PGID:-1000}
        DEBIAN_DOCKER_TAG: ${DEBIAN_DOCKER_TAG:-trixie-20261104-slim}
        NODE_DOCKER_TAG: ${NODE_DOCKER_TAG:-22.23.5-trixie-slim}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.3.0}
        CODE_SERVER_VERSION: ${CODE_SERVER_VERSION:-4.145.2}
        CODELLDB_VERSION: ${CODELLDB_VERSION:-1.12.3}
        COMPILER_EXPLORER_VERSION: ${COMPILER_EXPLORER_VERSION:-gh-20364}
    image: infrastructure/vscode-server
    container_name: vscode-server
    profiles:
      - vscode-server
      - local_ai
    extends:
      file: ../../common.yml
      service: service-base
    labels:
      - com.centurylinklabs.watchtower.enable=false
    depends_on:
      local-ai-init:
        condition: service_completed_successfully
      dind:
        condition: service_healthy
    env_file:
      - ./vscode-server.env
    volumes:
      - ${LOCAL_AI_WORKSPACE:-local_ai_workspace}:/workspace
      - ${LOCAL_AI_DOCS:-local_ai_docs}:/docs
      - vscode-server_home:/home/dev
      - type: volume
        source: dind_certs
        target: /certs/client
        read_only: true
        volume:
          subpath: client
    networks:
      - local-ai
      - dind-internal
      - local-ai-internet

volumes:
  vscode-server_home:
    name: vscode-server_home
  local_ai_workspace:
    name: local_ai_workspace
  local_ai_docs:
    name: local_ai_docs
  dind_certs:
    name: dind_certs

networks:
  local-ai:
    driver: bridge
    name: local-ai
    internal: true
  dind-internal:
    driver: bridge
    name: dind-internal
    internal: true
  local-ai-internet:
    driver: bridge
    name: local-ai-internet
