services:
  # dufs
  dufs:
    image: sigoden/dufs:${DUFS_DOCKER_TAG:-latest}
    container_name: dufs
    profiles:
      - dufs
#    user: ${PUID:-1000}:${PGID:-1000} 
    extends:
      file: ../../common.yml
      service: service-base
    depends_on:
      - caddy
    env_file:
      - ./env/dufs.env
    volumes:
      - public_data:/data
    networks:
      - caddy-files

volumes:
  public_data:
    name: public_data
  private_data:
    name: private_data

networks:
  caddy-files:
    driver: bridge
    name: caddy-files