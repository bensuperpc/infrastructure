services:
  # privatebin
  privatebin:
    image: privatebin/nginx-fpm-alpine:2.1.1
    container_name: privatebin
    profiles: [privatebin]
    labels:
      homepage.instance.private.group: Personal
      homepage.instance.private.name: privatebin
      homepage.instance.private.weight: "90"
      homepage.instance.private.icon: privatebin.png
      homepage.instance.private.href: https://privatebin.${DOMAIN}/
      homepage.instance.private.description: PrivateBin
    extends:
      file: ../../../common.yml
      service: service-base
    volumes:
      - privatebin_data:/srv/data
      - ./config/conf.php:/srv/cfg/conf.php:ro
    networks:
      - privatebin
      - proxy-private
    read_only: true

volumes:
  privatebin_data:
    name: privatebin_data

networks:
  privatebin: {}
