services:
  # it-tools
  it-tools:
    extends:
      file: ../../../common.yml
      service: service-base
    image: ghcr.io/sharevb/it-tools:2026.10.25
    container_name: it-tools
    profiles: [it-tools]
    labels:
      homepage.group: Public
      homepage.name: it-tools
      homepage.weight: "10"
      homepage.icon: it-tools.png
      homepage.href: https://it-tools.${DOMAIN}/
      homepage.description: IT Tools
    networks:
      - it-tools
      - proxy
    read_only: false

networks:
  it-tools: {}
