services:
  # memos
  memos:
    image: neosmemo/memos:26.11.1
    container_name: memos
    profiles: [memos]
    labels:
      homepage.instance.private.group: Personal
      homepage.instance.private.name: memos
      homepage.instance.private.weight: "40"
      homepage.instance.private.icon: memos.png
      homepage.instance.private.href: https://memos.${DOMAIN}/
      homepage.instance.private.description: Memos
    extends:
      file: ../../../common.yml
      service: service-base
    env_file:
      - ./memos.env
    volumes:
      - memos_config:/var/opt/memos
    networks:
      - memos
      - proxy-private

volumes:
  memos_config:
    name: memos_config

networks:
  memos: {}
