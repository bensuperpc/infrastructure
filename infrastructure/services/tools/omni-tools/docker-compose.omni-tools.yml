services:
  omni-tools:
    extends:
      file: ../../../common.yml
      service: service-base
    image: iib0011/omni-tools:0.7.0
    container_name: omni-tools
    profiles: [omni-tools]
    labels:
      homepage.group: Public
      homepage.name: omni-tools
      homepage.weight: "20"
      homepage.icon: omni-tools.png
      homepage.href: https://omni-tools.${DOMAIN}/
      homepage.description: Omni Tools
    networks:
      - omni-tools
      - proxy
    read_only: false

networks:
  omni-tools: {}
