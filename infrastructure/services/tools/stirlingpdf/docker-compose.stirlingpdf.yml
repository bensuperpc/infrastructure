services:
  # stirlingpdf
  stirlingpdf:
    image: stirlingtools/stirling-pdf:3.5.0
    container_name: stirlingpdf
    profiles: [stirlingpdf]
    mem_limit: 4g
    labels:
      homepage.instance.private.group: Personal
      homepage.instance.private.name: stirlingpdf
      homepage.instance.private.weight: "100"
      homepage.instance.private.icon: stirling-pdf.png
      homepage.instance.private.href: https://stirlingpdf.${DOMAIN}/
      homepage.instance.private.description: StirlingPDF
    extends:
      file: ../../../common.yml
      service: service-base
    env_file:
      - ./stirlingpdf.env
    volumes:
      - stirlingpdf_config:/configs
      - stirlingpdf_tessdata:/usr/share/tessdata
    networks:
      - stirlingpdf
      - proxy-private
    read_only: false

volumes:
  stirlingpdf_config:
    name: stirlingpdf_config
  stirlingpdf_tessdata:
    name: stirlingpdf_tessdata

networks:
  stirlingpdf: {}
