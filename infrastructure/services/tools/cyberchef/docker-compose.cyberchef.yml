services:
  # cyberchef
  cyberchef:
    extends:
      file: ../../../common.yml
      service: service-base
    image: ghcr.io/gchq/cyberchef:11.5.0
    container_name: cyberchef
    profiles: [cyberchef]
    labels:
      homepage.group: Public
      homepage.name: cyberchef
      homepage.weight: "30"
      homepage.icon: cyberchef.png
      homepage.href: https://cyberchef.${DOMAIN}/
      homepage.description: CyberChef
    networks:
      - cyberchef
      - proxy
    read_only: false

networks:
  cyberchef: {}
