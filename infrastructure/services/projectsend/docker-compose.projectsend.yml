services:
  # projectsend
  projectsend:
    extends:
      file: ../../common.yml
      service: service-base
    image: linuxserver/projectsend:${PROJECTSEND_DOCKER_TAG:-latest}
    container_name: projectsend
    profiles:
      - projectsend
    depends_on:
      - caddy
    env_file:
      - ./env/projectsend.env
    volumes:
      - projectsend_config:/config
      - projectsend_share:/data
    networks:
      - caddy-files
      - projectsend-internal

  # Database projectsend
  projectsend_db:
    image: mariadb:${PROJECTSEND_DB_DOCKER_TAG:-latest}
    container_name: projectsend_db
    profiles:
      - projectsend
    extends:
      file: ../../common.yml
      service: service-base
    depends_on:
      - caddy
    volumes:
      - projectsend_db:/var/lib/mysql:rw
    env_file:
      - ./env/projectsend_db.env
    command: '--default-authentication-plugin=mysql_native_password'
    networks:
      - projectsend-internal

volumes:
  projectsend_db:
    name: projectsend_db
  projectsend_config:
    name: projectsend_config
  projectsend_share:
    name: projectsend_share


networks:
  caddy-files:
    driver: bridge
    name: caddy-files
  projectsend-internal:
    driver: bridge
    name: projectsend-internal
