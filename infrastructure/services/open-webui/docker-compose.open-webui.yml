services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_DOCKER_TAG:-v0.13.3-slim}
    container_name: openwebui
    profiles:
      - local_ai
    extends:
      file: ../../common.yml
      service: service-base
    depends_on:
      ollama:
        condition: service_healthy
      openwebui-postgres:
        condition: service_healthy
    env_file:
      - ./openwebui.env
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - local-ai
      - openwebui-db

  openwebui-postgres:
    image: pgvector/pgvector:${PGVECTOR_DOCKER_TAG:-0.8.7-pg18}
    container_name: openwebui-postgres
    profiles:
      - local_ai
    extends:
      file: ../../common.yml
      service: service-base
    env_file:
      - ./openwebui-postgres.env
    volumes:
      - openwebui_postgres:/var/lib/postgresql
    networks:
      - openwebui-db
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s

volumes:
  openwebui_data:
    name: openwebui_data
  openwebui_postgres:
    name: openwebui_postgres

networks:
  local-ai:
    driver: bridge
    name: local-ai
    internal: true
  openwebui-db:
    driver: bridge
    name: openwebui-db
    internal: true
