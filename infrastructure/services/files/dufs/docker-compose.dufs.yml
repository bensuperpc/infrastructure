services:
  # dufs
  dufs:
    image: sigoden/dufs:v0.47.0
    container_name: dufs
    profiles: [dufs]
    labels:
      homepage.instance.private.group: Personal
      homepage.instance.private.name: dufs
      homepage.instance.private.weight: "110"
      homepage.instance.private.icon: dufs.png
      homepage.instance.private.href: https://dufs.${DOMAIN}/
      homepage.instance.private.description: Dufs
    user: ${PUID:-1000}:${PGID:-1000}
    extends:
      file: ../../../common.yml
      service: service-base
    env_file:
      - ./dufs.env
    volumes:
      - public_data:/data
    networks:
      - dufs
      - proxy-private

networks:
  dufs: {}
