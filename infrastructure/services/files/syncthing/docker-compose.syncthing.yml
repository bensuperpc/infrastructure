services:
  # syncthing
  syncthing:
    image: linuxserver/syncthing:v2.1.7-ls237
    container_name: syncthing
    profiles: [syncthing]
    labels:
      homepage.instance.private.group: Personal
      homepage.instance.private.name: syncthing
      homepage.instance.private.weight: "140"
      homepage.instance.private.icon: syncthing.png
      homepage.instance.private.href: https://syncthing.${DOMAIN}/
      homepage.instance.private.description: Syncthing
    extends:
      file: ../../../common.yml
      service: service-base
    env_file:
      - ./syncthing.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - syncthing_config:/config
      - public_data:/data1
      - private_data:/data2
    networks:
      - syncthing
      - proxy-private

volumes:
  syncthing_config:
    name: syncthing_config

networks:
  syncthing: {}
