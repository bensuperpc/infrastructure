services:
  # projectsend
  projectsend:
    extends:
      file: ../../../common.yml
      service: service-base
    image: linuxserver/projectsend:r2098-ls10
    container_name: projectsend
    profiles: [projectsend]
    labels:
      homepage.instance.private.group: Personal
      homepage.instance.private.name: projectsend
      homepage.instance.private.weight: "60"
      homepage.instance.private.icon: projectsend.png
      homepage.instance.private.href: https://projectsend.${DOMAIN}/
      homepage.instance.private.description: ProjectSend
    env_file:
      - ./projectsend.env
    volumes:
      - projectsend_config:/config
      - projectsend_share:/data
    networks:
      - projectsend
      - proxy-private

  # Database projectsend
  projectsend_db:
    image: mariadb:13.0.2
    container_name: projectsend_db
    profiles: [projectsend]
    extends:
      file: ../../../common.yml
      service: service-base
    volumes:
      - projectsend_db:/var/lib/mysql:rw
    env_file:
      - ./projectsend_db.env
    networks:
      - projectsend

volumes:
  projectsend_db:
    name: projectsend_db
  projectsend_config:
    name: projectsend_config
  projectsend_share:
    name: projectsend_share

networks:
  projectsend: {}
