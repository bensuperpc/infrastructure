services:
  # picoshare
  picoshare:
    extends:
      file: ../../../common.yml
      service: service-base
    image: mtlynch/picoshare:v1.5.5
    container_name: picoshare
    profiles: [picoshare]
    labels:
      homepage.instance.private.group: Personal
      homepage.instance.private.name: picoshare
      homepage.instance.private.weight: "70"
      homepage.instance.private.icon: mdi-share-variant
      homepage.instance.private.href: https://picoshare.${DOMAIN}/
      homepage.instance.private.description: PicoShare
    env_file:
      - ./picoshare.env
    volumes:
      - picoshare_data:/data
    networks:
      - picoshare
      - proxy-private
    read_only: false
#    tmpfs:
#      - /tmp

volumes:
  picoshare_data:
    name: picoshare_data

networks:
  picoshare: {}
