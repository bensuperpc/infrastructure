services:
  # privatebin
  privatebin:
    image: privatebin/nginx-fpm-alpine:${PRIVATEBIN_DOCKER_TAG:-latest}
    container_name: privatebin
    profiles:
      - privatebin
    extends:
      file: ../../common.yml
      service: service-base
    depends_on:
      - caddy
    volumes:
      - privatebin_data:/srv/data
      - ./config/conf.php:/srv/cfg/conf.php:ro
    networks:
      - caddy-tools
    read_only: true

volumes:
  privatebin_data:
    name: privatebin_data

networks:
  caddy-tools:
    driver: bridge
    name: caddy-tools
