services:
  compiler-explorer:
    build:
      context: ../../../images/dev
      target: compiler-explorer
      args:
        HOST_UID: ${PUID:-1000}
        HOST_GID: ${PGID:-1000}
        DEBIAN_DOCKER_TAG: ${DEBIAN_DOCKER_TAG:-trixie-20261104-slim}
        NODE_DOCKER_TAG: ${NODE_DOCKER_TAG:-22.23.5-trixie-slim}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.3.0}
        CODE_SERVER_VERSION: ${CODE_SERVER_VERSION:-4.145.2}
        CODELLDB_VERSION: ${CODELLDB_VERSION:-1.12.3}
        COMPILER_EXPLORER_VERSION: ${COMPILER_EXPLORER_VERSION:-gh-20403}
    image: infrastructure/compiler-explorer
    container_name: compiler-explorer
    profiles:
      - compiler-explorer
    extends:
      file: ../../../common.yml
      service: service-base
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - caddy-compiler-explorer

networks:
  caddy-compiler-explorer:
    driver: bridge
    name: caddy-compiler-explorer
    internal: true
