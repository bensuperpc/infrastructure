services:
  compiler-explorer:
    build:
      context: ../../../images/dev
      target: compiler-explorer
      args:
        HOST_UID: ${PUID:-1000}
        HOST_GID: ${PGID:-1000}
    image: infrastructure/compiler-explorer
    pull_policy: build
    container_name: compiler-explorer
    profiles: [compiler-explorer]
    labels:
      homepage.instance.private.group: Local AI
      homepage.instance.private.name: compiler-explorer
      homepage.instance.private.weight: "40"
      homepage.instance.private.icon: mdi-code-braces
      homepage.instance.private.href: https://compiler-explorer.${DOMAIN}/
      homepage.instance.private.description: Compiler Explorer
    extends:
      file: ../../../common.yml
      service: service-base
    networks:
      - proxy-compiler-explorer
