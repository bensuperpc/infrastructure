services:
  # VS Code in the browser, with the same tools as opencode; drives dind
  vscode-server:
    build:
      context: ../../../images/dev
      target: code-server
      args:
        HOST_UID: ${PUID:-1000}
        HOST_GID: ${PGID:-1000}
    image: infrastructure/vscode-server
    pull_policy: build
    container_name: vscode-server
    profiles: [local_ai]
    labels:
      homepage.instance.private.group: Local AI
      homepage.instance.private.name: vscode-server
      homepage.instance.private.weight: "30"
      homepage.instance.private.icon: code-server.png
      homepage.instance.private.href: https://vscode.${DOMAIN}/
      homepage.instance.private.description: VS Code Server
    extends:
      file: ../../../common.yml
      service: service-base
    depends_on:
      local-ai-init:
        condition: service_completed_successfully
      dind:
        condition: service_healthy
    env_file:
      - ./vscode-server.env
    volumes:
      - ${LOCAL_AI_WORKSPACE:-local_ai_workspace}:/workspace
      - ${LOCAL_AI_DOCS:-local_ai_docs}:/docs
      - vscode-server_home:/home/dev
      - type: volume
        source: dind_certs
        target: /certs/client
        read_only: true
        volume:
          subpath: client
    networks:
      - local-ai
      - dind-internal
      - local-ai-internet

volumes:
  vscode-server_home:
    name: vscode-server_home
