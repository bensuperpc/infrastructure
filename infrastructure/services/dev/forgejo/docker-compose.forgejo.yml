services:
  # forgejo
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.2
    container_name: forgejo
    profiles: [forgejo]
    labels:
      homepage.instance.private.group: Personal
      homepage.instance.private.name: forgejo
      homepage.instance.private.weight: "10"
      homepage.instance.private.icon: forgejo.png
      homepage.instance.private.href: https://git.${DOMAIN}/
      homepage.instance.private.description: Forgejo
    restart: on-failure:7
    depends_on:
      - database_forgejo
    ports:
      - "${LISTEN_ADDRESS:-0.0.0.0}:22:2222"
    env_file:
      - ./forgejo.env
    volumes:
      - forgejo_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - forgejo
      - proxy-private
#    user: ${PUID:-1000}:${PGID:-1000} 
    security_opt:
      - no-new-privileges:true
  
  # Database forgejo
  database_forgejo:
    image: mariadb:13.0.2
    container_name: database_forgejo
    profiles: [forgejo]
    extends:
      file: ../../../common.yml
      service: service-base
    volumes:
      - forgejo_db:/var/lib/mysql:rw
    env_file:
      - ./forgejo_db.env
    networks:
      - forgejo

  # forgejo-runner: Docker in Docker for the jobs, with TLS
  docker-in-docker:
    image: code.forgejo.org/oci/docker:29-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
    container_name: docker_dind
    profiles: [forgejo]
    hostname: docker
    restart: on-failure:7
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - forgejo_certs:/certs
      - forgejo_dind_data:/var/lib/docker
    networks:
      - forgejo
    healthcheck:
      test: [CMD, docker, info]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s

  forgejo_runner_register:
    image: codeberg.org/forgejo/forgejo:17.0.2
    container_name: forgejo_runner_register
    profiles: [forgejo]
    restart: on-failure:7
    # After forgejo_runner, which creates forgejo_runner owned by its user (1000)
    depends_on:
      - forgejo
      - forgejo_runner
    user: 1000:1000
    env_file:
      - ./forgejo_runner.env
    volumes:
      - forgejo_data:/data
      - forgejo_runner:/runner
    networks:
      - forgejo
    entrypoint: [sh, -c]
    command:
      - >-
        rm -f /runner/registered;
        until grep -qE '^INSTALL_LOCK *= *true' /data/gitea/conf/app.ini 2>/dev/null
        && wget -qO /dev/null http://forgejo:3000/api/v1/version
        && forgejo forgejo-cli actions register --name runner --secret "$$FORGEJO_RUNNER_SECRET" > /dev/null;
        do sleep 10; done;
        touch /runner/registered

  forgejo_runner:
    image: data.forgejo.org/forgejo/runner:13.2.2
    container_name: forgejo_runner
    profiles: [forgejo]
    restart: on-failure:7
    # docker-in-docker creates forgejo_certs/client at start
    depends_on:
      docker-in-docker:
        condition: service_healthy
    env_file:
      - ./forgejo_runner.env
    volumes:
      - forgejo_runner:/data
      - ./config/runner.yml:/config/runner.yml:ro
      - ./runner.sh:/runner.sh:ro
      - type: volume
        source: forgejo_certs
        target: /certs/client
        read_only: true
        volume:
          subpath: client
    networks:
      - forgejo
    command: [sh, /runner.sh]

volumes:
  forgejo_data:
    name: forgejo_data
  forgejo_db:
    name: forgejo_db
  forgejo_certs:
    name: forgejo_certs
  forgejo_runner:
    name: forgejo_runner
  forgejo_dind_data:
    name: forgejo_dind_data

networks:
  forgejo: {}
