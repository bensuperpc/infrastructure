services:
  dependency-track-apiserver:
    image: dependencytrack/apiserver:5.2.2
    container_name: dependency-track-apiserver
    profiles: [dependency-track]
    mem_limit: 8g
    depends_on:
      dependency-track-postgres:
        condition: service_healthy
    env_file:
      - ./dependency-track.env
    extends:
      file: ../../../common.yml
      service: service-base
    networks:
      - dependency-track
      - proxy-private
    volumes:
    - 'dtrack-data:/data'

  dependency-track-frontend:
    image: dependencytrack/frontend:5.2.2
    container_name: dependency-track-frontend
    profiles: [dependency-track]
    labels:
      homepage.instance.private.group: Admin
      homepage.instance.private.name: dependency-track
      homepage.instance.private.weight: "50"
      homepage.instance.private.icon: dependency-track.png
      homepage.instance.private.href: https://dependency-track.${DOMAIN}/
      homepage.instance.private.description: SBOM and vulnerabilities
    extends:
      file: ../../../common.yml
      service: service-base
    networks:
      - dependency-track
      - proxy-private
    depends_on:
      dependency-track-apiserver:
        condition: service_healthy
    env_file:
      - ./dependency-track-frontend.env

  dependency-track-postgres:
    image: postgres:18.7-alpine3.24
    container_name: dependency-track-postgres
    profiles: [dependency-track]
    env_file:
      - ./postgres.env
    extends:
      file: ../../../common.yml
      service: postgres-base
    volumes:
    - "dtrack-postgres-data:/var/lib/postgresql"
    networks:
      - dependency-track

volumes:
  dtrack-data:
    name: dtrack-data
  dtrack-postgres-data:
    name: dtrack-postgres-data

networks:
  dependency-track: {}
