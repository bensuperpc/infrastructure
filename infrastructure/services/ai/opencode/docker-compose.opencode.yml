services:
  opencode:
    build:
      context: ../../../images/dev
      target: opencode
      args:
        HOST_UID: ${PUID:-1000}
        HOST_GID: ${PGID:-1000}
    image: infrastructure/opencode
    pull_policy: build
    container_name: opencode
    profiles: [local_ai]
    labels:
      homepage.instance.private.group: Local AI
      homepage.instance.private.name: opencode
      homepage.instance.private.weight: "20"
      homepage.instance.private.icon: opencode.png
      homepage.instance.private.href: https://opencode.${DOMAIN}/
      homepage.instance.private.description: AI coding agent
    extends:
      file: ../../../common.yml
      service: service-base
    depends_on:
      local-ai-init:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      mcp-searxng:
        condition: service_healthy
      openzim-mcp:
        condition: service_healthy
      dind:
        condition: service_healthy
    env_file:
      - ./opencode.env
    volumes:
      - ${LOCAL_AI_WORKSPACE:-local_ai_workspace}:/workspace
      - ${LOCAL_AI_DOCS:-local_ai_docs}:/docs:ro
      - opencode_home:/home/dev
      - ./config:/etc/opencode:ro
      - type: volume
        source: dind_certs
        target: /certs/client
        read_only: true
        volume:
          subpath: client
    networks:
      - local-ai
      - dind-internal
      - proxy-compiler-explorer

volumes:
  opencode_home:
    name: opencode_home
