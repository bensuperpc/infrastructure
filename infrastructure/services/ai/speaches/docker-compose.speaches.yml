services:
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    container_name: speaches
    profiles: [local_ai]
    mem_limit: 4g
    extends:
      file: ../../../common.yml
      service: service-base
    env_file:
      - ./speaches.env
    volumes:
      - speaches_models:/home/ubuntu/.cache/huggingface/hub
    networks:
      - local-ai
      - local-ai-internet
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8000/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
      start_interval: 5s

volumes:
  speaches_models:
    name: speaches_models
