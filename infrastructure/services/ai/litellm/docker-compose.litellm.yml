services:
  # OpenAI-compatible proxy for openwebui: external APIs (OpenAI, Anthropic...) and Ollama, with keys and spend tracking
  litellm:
    image: ghcr.io/berriai/litellm:v1.111.0
    container_name: litellm
    profiles: [local_ai]
    labels:
      homepage.instance.private.group: Local AI
      homepage.instance.private.name: litellm
      homepage.instance.private.weight: "80"
      homepage.instance.private.icon: mdi-api
      homepage.instance.private.href: https://litellm.${DOMAIN}/
      homepage.instance.private.description: LiteLLM
    extends:
      file: ../../../common.yml
      service: service-base
    depends_on:
      litellm-postgres:
        condition: service_healthy
    env_file:
      - ./litellm.env
    command: ["--port", "4000", "--telemetry", "False"]
    networks:
      - local-ai
      - litellm-db
      - litellm-internet
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s

  litellm-postgres:
    image: postgres:18.7-alpine3.24
    container_name: litellm-postgres
    profiles: [local_ai]
    extends:
      file: ../../../common.yml
      service: postgres-base
    env_file:
      - ./litellm-postgres.env
    volumes:
      - litellm_postgres:/var/lib/postgresql
    networks:
      - litellm-db

volumes:
  litellm_postgres:
    name: litellm_postgres

networks:
  litellm-db:
    driver: bridge
    name: litellm-db
    internal: true
  litellm-internet:
    driver: bridge
    name: litellm-internet
