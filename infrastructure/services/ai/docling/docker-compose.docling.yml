services:
  # Converts PDF, Word, PowerPoint... to Markdown, for openwebui and opencode
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.40.0
    container_name: docling
    profiles: [local_ai]
    # Memory cap: a heavy job cannot take all the RAM of the host
    mem_limit: 8g
    labels:
      homepage.instance.private.group: Local AI
      homepage.instance.private.name: docling
      homepage.instance.private.weight: "60"
      homepage.instance.private.icon: docling.png
      homepage.instance.private.href: https://docling.${DOMAIN}/
      homepage.instance.private.description: Documents to Markdown
    extends:
      file: ../../../common.yml
      service: service-base
    env_file:
      - ./docling.env
    networks:
      - local-ai
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s
