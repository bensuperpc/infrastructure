services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.13.5-slim
    container_name: openwebui
    profiles: [local_ai]
    labels:
      homepage.instance.private.group: Local AI
      homepage.instance.private.name: open-webui
      homepage.instance.private.weight: "10"
      homepage.instance.private.icon: open-webui.png
      homepage.instance.private.href: https://openwebui.${DOMAIN}/
      homepage.instance.private.description: Chat and RAG with Ollama
    extends:
      file: ../../../common.yml
      service: service-base
    depends_on:
      ollama:
        condition: service_healthy
      openwebui-postgres:
        condition: service_healthy
    env_file:
      - ./openwebui.env
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - local-ai
      - openwebui-db

  openwebui-postgres:
    image: pgvector/pgvector:0.8.7-pg18
    container_name: openwebui-postgres
    profiles: [local_ai]
    extends:
      file: ../../../common.yml
      service: postgres-base
    env_file:
      - ./openwebui-postgres.env
    volumes:
      - openwebui_postgres:/var/lib/postgresql
    networks:
      - openwebui-db

volumes:
  openwebui_data:
    name: openwebui_data
  openwebui_postgres:
    name: openwebui_postgres

networks:
  openwebui-db:
    driver: bridge
    name: openwebui-db
    internal: true
