services:
  # Diagrams written as text (Mermaid, PlantUML, Graphviz...) rendered as SVG or PNG
  kroki:
    image: yuzutech/kroki:0.37.1
    container_name: kroki
    profiles: [local_ai]
    labels:
      homepage.instance.private.group: Local AI
      homepage.instance.private.name: kroki
      homepage.instance.private.weight: "70"
      homepage.instance.private.icon: mdi-sitemap
      homepage.instance.private.href: https://kroki.${DOMAIN}/
      homepage.instance.private.description: Diagrams from text
    extends:
      file: ../../../common.yml
      service: service-base
    depends_on:
      - kroki-mermaid
    env_file:
      - ./kroki.env
    networks:
      - local-ai
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8000/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s

  kroki-mermaid:
    image: yuzutech/kroki-mermaid:0.37.1
    container_name: kroki-mermaid
    profiles: [local_ai]
    extends:
      file: ../../../common.yml
      service: service-base
    networks:
      - local-ai
