services:
  # Diagrams written as text (Mermaid, PlantUML, Graphviz...) rendered as SVG or PNG
  kroki:
    image: yuzutech/kroki:${KROKI_DOCKER_TAG:-0.36.0}
    container_name: kroki
    profiles:
      - local_ai
    extends:
      file: ../../../common.yml
      service: service-base
    depends_on:
      - kroki-mermaid
    env_file:
      - ./kroki.env
    networks:
      - local-ai
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8000/health]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s

  kroki-mermaid:
    image: yuzutech/kroki-mermaid:${KROKI_DOCKER_TAG:-0.36.0}
    container_name: kroki-mermaid
    profiles:
      - local_ai
    extends:
      file: ../../../common.yml
      service: service-base
    networks:
      - local-ai

networks:
  local-ai:
    driver: bridge
    name: local-ai
    internal: true
