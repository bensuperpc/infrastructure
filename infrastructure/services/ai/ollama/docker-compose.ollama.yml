services:
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-0.40.16-rocm}
    container_name: ollama
    profiles:
      - local_ai
    extends:
      file: ../../../common.yml
      service: service-base
    devices:
      - /dev/kfd
      - /dev/dri
    env_file:
      - ./ollama.env
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - 127.0.0.1:11434:11434
    networks:
      - local-ai
      - local-ai-internet
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s

volumes:
  ollama_data:
    name: ollama_data

networks:
  local-ai:
    driver: bridge
    name: local-ai
    internal: true
  local-ai-internet:
    driver: bridge
    name: local-ai-internet
