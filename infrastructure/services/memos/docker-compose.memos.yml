services:
  # memos
  memos:
    image: neosmemo/memos:${MEMOS_DOCKER_TAG:-latest}
    container_name: memos
    profiles:
      - memos
    extends:
      file: ../../common.yml
      service: service-base
    depends_on:
      - caddy
    env_file:
      - ./env/memos.env
    volumes:
      - memos_config:/var/opt/memos
    networks:
      - caddy-tools

volumes:
  memos_config:
    name: memos_config

networks:
  caddy-tools:
    driver: bridge
    name: caddy-tools
