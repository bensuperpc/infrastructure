services:
  # Wordpress
  wordpress:
    image: wordpress:7.1.4-php8.5-fpm
    container_name: wordpress
    profiles: [wordpress]
    labels:
      homepage.group: Public
      homepage.name: wordpress
      homepage.weight: "60"
      homepage.icon: wordpress.png
      homepage.href: https://wordpress.${DOMAIN}/
      homepage.description: Wordpress
    restart: on-failure:7
    depends_on:
      - wordpress_db
    env_file:
      - ./wordpress.env
    environment:
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ./config/wordpress/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - wordpress:/var/www/html:rw
    networks:
      - wordpress
      - proxy
    security_opt:
      - no-new-privileges:true

  # Database wordpress
  wordpress_db:
    image: mariadb:13.0.2
    container_name: wordpress_db
    profiles: [wordpress]
    extends:
      file: ../../../common.yml
      service: service-base
    volumes:
      - wordpress_db:/var/lib/mysql:rw
    env_file:
      - ./wordpress_db.env
    environment:
      - TZ=${TZ:-Europe/Paris}
    networks:
      - wordpress

  wordpress_backup:
    container_name: wordpress_backup
    profiles: [wordpress]
    extends:
      file: ../../../common.yml
      service: backup-base
    depends_on:
      - wordpress
    env_file:
      - ./wordpress_backup.env
    volumes:
      - wordpress_backup:/mnt/restic
      - wordpress_db:/data/wordpress_db:ro
      - wordpress:/data/wordpress:ro

volumes:
  wordpress: { name: wordpress }
  wordpress_db:
    name: wordpress_db
  wordpress_backup:
    name: wordpress_backup

networks:
  wordpress: {}
