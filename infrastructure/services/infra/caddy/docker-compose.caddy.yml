services:
  # Caddy
  caddy:
    #image: bensuperpc/caddy-l4:latest
    image: caddy:${CADDY_DOCKER_TAG:-2.11.9-alpine}
    container_name: caddy
    profiles:
      - caddy
    depends_on:
      main_infrastructure:
        condition: service_completed_successfully
    ports:
      - ${LISTEN_ADDRESS:-0.0.0.0}:80:80/tcp
      - ${LISTEN_ADDRESS:-0.0.0.0}:80:80/udp
      - ${LISTEN_ADDRESS:-0.0.0.0}:443:443/tcp
      - ${LISTEN_ADDRESS:-0.0.0.0}:443:443/udp
    volumes:
      - caddy_data:/data:rw
      - caddy_config:/config:rw
      - ./config:/etc/caddy:ro
      - wordpress:/var/www/html:rw
      - public_data:/public_data:ro

    networks:
      - caddy-infra
      - caddy-media
      - caddy-tools
      - caddy-files
      - caddy-dev
      - caddy-web
      - local-ai
      - caddy-compiler-explorer
    env_file:
      - ./caddy.env
    extends:
      file: ../../../common.yml
      service: service-base
    healthcheck:
      test: pidof caddy || exit 1
      interval: 120s
      timeout: 10s
      retries: 3

  caddy_backup:
    image: mazzolino/restic:${RESTIC_DOCKER_TAG:-1.8.2}
    container_name: caddy_backup
    profiles:
      - caddy
    depends_on:
      - caddy
    restart: on-failure:7
    env_file:
      - ./caddy_backup.env
    environment:
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - caddy_backup:/mnt/restic
      - caddy_data:/data:ro
    network_mode: none
    cap_drop:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN

volumes:
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
  caddy_backup:
    name: caddy_backup
  wordpress:
    name: wordpress
  public_data:
    name: public_data

networks:
  caddy-infra:
    driver: bridge
    name: caddy-infra
  caddy-media:
    driver: bridge
    name: caddy-media
  caddy-tools:
    driver: bridge
    name: caddy-tools
  caddy-files:
    driver: bridge
    name: caddy-files
  caddy-dev:
    driver: bridge
    name: caddy-dev
  caddy-web:
    driver: bridge
    name: caddy-web
  local-ai:
    driver: bridge
    name: local-ai
    internal: true
  caddy-compiler-explorer:
    driver: bridge
    name: caddy-compiler-explorer
    internal: true
