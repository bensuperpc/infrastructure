services:
  # Caddy
  caddy:
    #image: bensuperpc/caddy-l4:latest
    build:
      context: ../../../images/caddy
    image: infrastructure/caddy
    pull_policy: build
    container_name: caddy
    profiles: [core]
    labels:
      homepage.group: Public
      homepage.name: caddy
      homepage.weight: "50"
      homepage.icon: caddy.png
      homepage.href: https://public.${DOMAIN}/
      homepage.description: File browser
    depends_on:
      main_infrastructure:
        condition: service_completed_successfully
      acme-dns:
        condition: service_started
    ports:
      - ${LISTEN_ADDRESS:-0.0.0.0}:80:80/tcp
      - ${LISTEN_ADDRESS:-0.0.0.0}:80:80/udp
      - ${LISTEN_ADDRESS:-0.0.0.0}:443:443/tcp
      - ${LISTEN_ADDRESS:-0.0.0.0}:443:443/udp
    volumes:
      - caddy_data:/data:rw
      - caddy_config:/config:rw
      - ./config:/etc/caddy:ro
      - wordpress:/var/www/html:rw
      - public_data:/public_data:ro

    networks:
      - core
      - local-ai
      - proxy
      - proxy-private
      - proxy-torrent
      - proxy-compiler-explorer
    env_file:
      - ./caddy.env
    extends:
      file: ../../../common.yml
      service: service-base
    healthcheck:
      test: pidof caddy || exit 1
      interval: 120s
      timeout: 10s
      retries: 3

  caddy_backup:
    container_name: caddy_backup
    profiles: [core]
    extends:
      file: ../../../common.yml
      service: backup-base
    depends_on:
      - caddy
    env_file:
      - ./caddy_backup.env
    volumes:
      - caddy_backup:/mnt/restic
      - caddy_data:/data:ro

volumes:
  caddy_data: { name: caddy_data }
  caddy_config: { name: caddy_config }
  caddy_backup: { name: caddy_backup }