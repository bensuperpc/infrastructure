services:
  dozzle:
    image: amir20/dozzle:v11.4.3
    container_name: dozzle
    profiles: [dozzle]
    labels:
      homepage.instance.private.group: Admin
      homepage.instance.private.name: dozzle
      homepage.instance.private.weight: "30"
      homepage.instance.private.icon: dozzle.png
      homepage.instance.private.href: https://dozzle.${DOMAIN}/
      homepage.instance.private.description: Dozzle
    restart: on-failure:7
    depends_on:
      - dozzle-dockerproxy
    env_file:
      - ./dozzle.env
    environment:
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - dozzle_data:/data
    secrets:
      - source: dozzle_users
        target: /data/users.yml
    networks:
      - dozzle
      - proxy-private
      - dozzle-internal
    
  dozzle-dockerproxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: dozzle-dockerproxy
    profiles: [dozzle]
    restart: on-failure:7
    environment:
      - CONTAINERS=1
      - POST=0
      - PING=1
      - VERSION=1
      - EVENTS=1
      - INFO=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dozzle-internal

networks:
  dozzle: {}
  dozzle-internal:
    driver: bridge
    name: dozzle-internal
  
volumes:
  dozzle_data:
    name: dozzle_data

secrets:
  dozzle_users:
    file: ./config/users.yml
