settings:
  log:
    level: INFO
defaults:
  service:
    options:
      interval: 1h
service:
  # infra
  caddy:
    latest_version: {type: github, url: caddyserver/caddy}
    dashboard: {tags: [infra]}
  acme-dns:
    latest_version: {type: github, url: acme-dns/acme-dns}
    dashboard: {tags: [infra]}
  authelia:
    latest_version: {type: github, url: authelia/authelia}
    dashboard: {tags: [infra]}
  homepage:
    latest_version: {type: github, url: gethomepage/homepage}
    dashboard: {tags: [infra]}
  uptime-kuma:
    latest_version: {type: github, url: louislam/uptime-kuma}
    dashboard: {tags: [infra]}
  dozzle:
    latest_version: {type: github, url: amir20/dozzle}
    dashboard: {tags: [infra]}
  argus:
    latest_version: {type: github, url: release-argus/Argus}
    dashboard: {tags: [infra]}
  # ai
  ollama:
    latest_version: {type: github, url: ollama/ollama}
    dashboard: {tags: [ai]}
  open-webui:
    latest_version: {type: github, url: open-webui/open-webui}
    dashboard: {tags: [ai]}
  opencode:
    latest_version:
      type: github
      url: anomalyco/opencode
      # The repository also publishes 1.x maintenance and process-daemon releases
      require: {regex_version: ^2\.}
    dashboard: {tags: [ai]}
  docling-serve:
    latest_version: {type: github, url: docling-project/docling-serve}
    dashboard: {tags: [ai]}
  kroki:
    latest_version: {type: github, url: yuzutech/kroki}
    dashboard: {tags: [ai]}
  kiwix-tools:
    latest_version: {type: github, url: kiwix/kiwix-tools}
    dashboard: {tags: [ai]}
  openzim-mcp:
    latest_version: {type: github, url: cameronrye/openzim-mcp}
    dashboard: {tags: [ai]}
  mcp-searxng:
    latest_version: {type: github, url: ihor-sokoliuk/mcp-searxng}
    dashboard: {tags: [ai]}
  speaches:
    latest_version: {type: github, url: speaches-ai/speaches, use_prerelease: true}
    dashboard: {tags: [ai]}
  vllm:
    latest_version:
      type: github
      url: vllm-project/vllm
      require: {regex_version: '^v?[0-9]+\.[0-9]+\.[0-9]+$'}
    dashboard: {tags: [ai]}
  # dev
  forgejo:
    latest_version: {type: forgejo, host: https://codeberg.org, url: forgejo/forgejo}
    dashboard: {tags: [dev]}
  forgejo-runner:
    latest_version: {type: forgejo, host: https://code.forgejo.org, url: forgejo/runner}
    dashboard: {tags: [dev]}
  code-server:
    latest_version: {type: github, url: coder/code-server}
    dashboard: {tags: [dev]}
  dependency-track:
    latest_version: {type: github, url: DependencyTrack/dependency-track}
    dashboard: {tags: [dev]}
  # tools
  it-tools:
    latest_version: {type: github, url: sharevb/it-tools}
    dashboard: {tags: [tools]}
  omni-tools:
    latest_version: {type: github, url: iib0011/omni-tools}
    dashboard: {tags: [tools]}
  cyberchef:
    latest_version: {type: github, url: gchq/CyberChef}
    dashboard: {tags: [tools]}
  bentopdf:
    latest_version: {type: github, url: alam00000/bentopdf}
    dashboard: {tags: [tools]}
  stirling-pdf:
    latest_version: {type: github, url: Stirling-Tools/Stirling-PDF}
    dashboard: {tags: [tools]}
  privatebin:
    latest_version: {type: github, url: PrivateBin/PrivateBin}
    dashboard: {tags: [tools]}
  memos:
    latest_version: {type: github, url: usememos/memos}
    dashboard: {tags: [tools]}
  # files and media
  dufs:
    latest_version: {type: github, url: sigoden/dufs}
    dashboard: {tags: [files]}
  picoshare:
    latest_version: {type: github, url: mtlynch/picoshare}
    dashboard: {tags: [files]}
  psitransfer:
    latest_version: {type: github, url: psi-4ward/psitransfer}
    dashboard: {tags: [files]}
  syncthing:
    latest_version: {type: github, url: syncthing/syncthing}
    dashboard: {tags: [files]}
  jellyfin:
    latest_version: {type: github, url: jellyfin/jellyfin}
    dashboard: {tags: [media]}
  immich:
    latest_version: {type: github, url: immich-app/immich}
    dashboard: {tags: [media]}
  qbittorrent:
    latest_version:
      type: github
      url: qbittorrent/qBittorrent
      url_commands:
        - {type: regex, regex: '^release-([0-9.]+)$'}
    dashboard: {tags: [media]}
  transmission:
    latest_version: {type: github, url: transmission/transmission}
    dashboard: {tags: [media]}
