services:
  # argus
  argus:
    image: releaseargus/argus:0.40.1
    container_name: argus
    profiles: [argus]
    labels:
      homepage.instance.private.group: Admin
      homepage.instance.private.name: argus
      homepage.instance.private.weight: "40"
      homepage.instance.private.icon: mdi-update
      homepage.instance.private.href: https://argus.${DOMAIN}/
      homepage.instance.private.description: Application updates
    environment:
      - ARGUS_UID=${PUID:-1000}
      - ARGUS_GID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
      - ARGUS_SERVICE_LATEST_VERSION_GITHUB_ACCESS_TOKEN=${ARGUS_GITHUB_TOKEN:-}
    restart: on-failure:7
    networks:
      - argus
      - proxy-private
    volumes:
      - argus_data:/app/data/
      - ./config/config.yml:/app/config.yml
    # healthcheck:
    #   test: ["CMD", "/healthcheck", "http://localhost:8080/api/v1/healthcheck"]
    #   interval: 1m
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s

volumes:
  argus_data:
    name: argus_data

networks:
  argus: {}
