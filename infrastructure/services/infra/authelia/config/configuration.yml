theme: auto

server:
  address: "tcp://0.0.0.0:9091"
  endpoints:
    authz:
      forward-auth:
        implementation: ForwardAuth
        authn_strategies:
          - name: CookieSession

log:
  level: info

authentication_backend:
  file:
    path: /config/users_database.yml

# totp:
#   issuer: '{{ env "DOMAIN" }}'

access_control:
  default_policy: deny
  rules:
    - domain:
        - 'authelia.{{ env "DOMAIN" }}'
        - 'www.{{ env "DOMAIN" }}'
        - 'public.{{ env "DOMAIN" }}'
        - 'it-tools.{{ env "DOMAIN" }}'
        - 'omni-tools.{{ env "DOMAIN" }}'
        - 'cyberchef.{{ env "DOMAIN" }}'
        - 'bentopdf.{{ env "DOMAIN" }}'
        - 'wordpress.{{ env "DOMAIN" }}'
        - 'homepage.{{ env "DOMAIN" }}'
        - 'forgejo.{{ env "DOMAIN" }}'
      policy: bypass
    - domain:
        - 'jellyfin.{{ env "DOMAIN" }}'
        - 'immich.{{ env "DOMAIN" }}'
        - 'openwebui.{{ env "DOMAIN" }}'
        - 'kiwix.{{ env "DOMAIN" }}'
        - 'qbittorrent.{{ env "DOMAIN" }}'
        - 'syncthing.{{ env "DOMAIN" }}'
        - 'torrent.{{ env "DOMAIN" }}'
        - 'searxng.{{ env "DOMAIN" }}'
        - 'litellm.{{ env "DOMAIN" }}'
      subject:
      - 'group:admins'
      - 'group:users'
      policy: one_factor
    # Everything else, including opencode, vscode, compiler-explorer, docling and kroki: admins only
    - domain:
        - '*.{{ env "DOMAIN" }}'
      subject:
      - 'group:admins'
      policy: one_factor
    # - domain: 'dependency-track.{{ env "DOMAIN" }}'
    #   resources:
    #     - "^/api/.*"
    #   policy: bypass
#    - domain: '*.{{ env "DOMAIN" }}'
#      policy: two_factor

session:
  expiration: 72h
  inactivity: 60m
  remember_me: 1M
  cookies:
    - domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://authelia.{{ env "DOMAIN" }}'

regulation:
  max_retries: 5
  find_time: 3m
  ban_time: 30m

storage:
  postgres: {}

notifier:
  filesystem:
    filename: /data/notification.txt
  # smtp:
  #   address: "submission://smtp.example.com:587"
