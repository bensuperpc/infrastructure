services:
  authelia:
    container_name: authelia    
    profiles: [core]
    labels:
      homepage.instance.private.group: Admin
      homepage.instance.private.name: authelia
      homepage.instance.private.weight: "20"
      homepage.instance.private.icon: authelia.png
      homepage.instance.private.href: https://authelia.${DOMAIN}/
      homepage.instance.private.description: Authelia
    image: authelia/authelia:4.39.28
    depends_on:
      authelia-postgres:
        condition: service_healthy
    extends:
      file: ../../../common.yml
      service: service-base
    # environment:
    #   - TZ=America/New_York
#       - PUID=${PUID:-1000}
#       - PGID=${PGID:-1000}
    env_file:
      - ./authelia.env
    volumes:
      - ./config/configuration.yml:/config/configuration.yml:ro
      - ./config/users_database.yml:/config/users_database.yml:ro
      - authelia_data:/data
    networks:
      - core
      - authelia-db

  authelia-postgres:
    image: postgres:18.7-alpine3.24
    container_name: authelia-postgres
    profiles: [core]
    extends:
      file: ../../../common.yml
      service: postgres-base
    volumes:
      - authelia_db_data:/var/lib/postgresql
    env_file:
      - ./authelia_postgres.env
    networks:
      - authelia-db

networks:
  authelia-db:
    name: authelia-db
    internal: true

volumes:
  authelia_db_data:
    name: authelia_db_data
  authelia_data:
    name: authelia_data
