services:
  # Fetches the Markdown docs read
  local-ai-init:
    build:
      context: ../../images/dev
      target: opencode
      args:
        HOST_UID: ${PUID:-1000}
        HOST_GID: ${PGID:-1000}
        DEBIAN_DOCKER_TAG: ${DEBIAN_DOCKER_TAG:-trixie-20261104-slim}
        NODE_DOCKER_TAG: ${NODE_DOCKER_TAG:-22.23.5-trixie-slim}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.3.0}
        CODE_SERVER_VERSION: ${CODE_SERVER_VERSION:-4.145.2}
        CODELLDB_VERSION: ${CODELLDB_VERSION:-1.12.3}
        COMPILER_EXPLORER_VERSION: ${COMPILER_EXPLORER_VERSION:-gh-20364}
    image: infrastructure/local-ai-init
    container_name: local-ai-init
    profiles:
      - local_ai
      - vscode-server
    extends:
      file: ../../common.yml
      service: service-base
    labels:
      - com.centurylinklabs.watchtower.enable=false
    user: "0:0"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${LOCAL_AI_WORKSPACE:-local_ai_workspace}:/workspace
      - ${LOCAL_AI_DOCS:-local_ai_docs}:/docs
      - ./fetch_docs.sh:/fetch_docs.sh:ro
    command: [bash, /fetch_docs.sh]
    networks:
      - local-ai-internet

volumes:
  local_ai_workspace:
    name: local_ai_workspace
  local_ai_docs:
    name: local_ai_docs

networks:
  local-ai-internet:
    driver: bridge
    name: local-ai-internet
