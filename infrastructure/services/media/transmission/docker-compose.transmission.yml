services:
  # transmission
  transmission:
    image: lscr.io/linuxserver/transmission:4.1.4-r0-ls370
    container_name: transmission
    profiles: [transmission]
    labels:
      homepage.instance.private.group: Personal
      homepage.instance.private.name: transmission
      homepage.instance.private.weight: "130"
      homepage.instance.private.icon: transmission.png
      homepage.instance.private.href: https://transmission.${DOMAIN}/
      homepage.instance.private.description: Transmission
    extends:
      file: ../../../common.yml
      service: service-base
    env_file:
      - ./transmission.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - transmission_config:/config
      - public_data:/downloads
      - transmission_watch:/watch
    networks:
      - transmission
      - proxy-torrent

volumes:
  transmission_config:
    name: transmission_config
  transmission_watch:
    name: transmission_watch

networks:
  transmission: {}
