services:
  # Jellyfin
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.4ubu2604-ls61
    container_name: jellyfin
    profiles: [jellyfin]
    labels:
      homepage.instance.private.group: Personal
      homepage.instance.private.name: jellyfin
      homepage.instance.private.weight: "20"
      homepage.instance.private.icon: jellyfin.png
      homepage.instance.private.href: https://jellyfin.${DOMAIN}/
      homepage.instance.private.description: Jellyfin
    extends:
      file: ../../../common.yml
      service: service-base
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Paris}
    env_file:
      - ./jellyfin.env
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - public_data:/public
      - private_data:/private
    # Hardware acceleration (For Intel and AMD GPUs)
    devices:
      - /dev/dri:/dev/dri
    networks:
      - jellyfin
      - proxy-private

volumes:
  jellyfin_config:
    name: jellyfin_config
  jellyfin_cache:
    name: jellyfin_cache

networks:
  jellyfin: {}
