services:
  # Immich: from https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.4.2
    container_name: immich-server
    profiles: [immich]
    labels:
      homepage.instance.private.group: Personal
      homepage.instance.private.name: immich
      homepage.instance.private.weight: "30"
      homepage.instance.private.icon: immich.png
      homepage.instance.private.href: https://immich.${DOMAIN}/
      homepage.instance.private.description: Immich
    extends:
      file: ../../../common.yml
      service: service-base
    depends_on:
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    env_file:
      - ./immich.env
    volumes:
      - immich_data:/data
    networks:
      - immich
      - proxy-private
      - immich-db

  # GPU: see https://docs.immich.app/features/ml-hardware-acceleration
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.2
    container_name: immich-machine-learning
    profiles: [immich]
    # Memory cap: a heavy job cannot take all the RAM of the host
    mem_limit: 4g
    extends:
      file: ../../../common.yml
      service: service-base
    env_file:
      - ./immich-machine-learning.env
    volumes:
      - immich_model_cache:/cache
    networks:
      - immich

  immich-redis:
    image: valkey/valkey:9.2.0
    container_name: immich-redis
    profiles: [immich]
    extends:
      file: ../../../common.yml
      service: service-base
    volumes:
      - immich_redis:/data
    networks:
      - immich-db
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-postgres
    profiles: [immich]
    extends:
      file: ../../../common.yml
      service: service-base
    env_file:
      - ./immich-postgres.env
    volumes:
      - immich_postgres:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - immich-db
    healthcheck:
      start_period: 120s
      start_interval: 2s

volumes:
  immich_data:
    name: immich_data
  immich_model_cache:
    name: immich_model_cache
  immich_redis:
    name: immich_redis
  immich_postgres:
    name: immich_postgres

networks:
  immich: {}
  immich-db:
    driver: bridge
    name: immich-db
    internal: true
