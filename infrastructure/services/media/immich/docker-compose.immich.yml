services:
  # Immich: from https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_DOCKER_TAG:-v3.4.2}
    container_name: immich-server
    profiles:
      - immich
    extends:
      file: ../../../common.yml
      service: service-base
    depends_on:
      caddy:
        condition: service_started
      immich-postgres:
        condition: service_healthy
      immich-redis:
        condition: service_healthy
    env_file:
      - ./immich.env
    volumes:
      - immich_data:/data
    networks:
      - caddy-media
      - immich-db
      - immich-ml

  # GPU: see https://docs.immich.app/features/ml-hardware-acceleration
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_DOCKER_TAG:-v3.4.2}
    container_name: immich-machine-learning
    profiles:
      - immich
    extends:
      file: ../../../common.yml
      service: service-base
    env_file:
      - ./immich-machine-learning.env
    volumes:
      - immich_model_cache:/cache
    networks:
      - immich-ml

  immich-redis:
    image: valkey/valkey:${IMMICH_VALKEY_DOCKER_TAG:-9.1.2}
    container_name: immich-redis
    profiles:
      - immich
    extends:
      file: ../../../common.yml
      service: service-base
    volumes:
      - immich_redis:/data
    networks:
      - immich-db
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  immich-postgres:
    image: ghcr.io/immich-app/postgres:${IMMICH_POSTGRES_DOCKER_TAG:-14-vectorchord0.4.3-pgvectors0.2.0}
    container_name: immich-postgres
    profiles:
      - immich
    extends:
      file: ../../../common.yml
      service: service-base
    env_file:
      - ./immich-postgres.env
    volumes:
      - immich_postgres:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - immich-db
    healthcheck:
      start_period: 120s
      start_interval: 2s

volumes:
  immich_data:
    name: immich_data
  immich_model_cache:
    name: immich_model_cache
  immich_redis:
    name: immich_redis
  immich_postgres:
    name: immich_postgres

networks:
  caddy-media:
    driver: bridge
    name: caddy-media
  immich-db:
    driver: bridge
    name: immich-db
    internal: true
  immich-ml:
    driver: bridge
    name: immich-ml
