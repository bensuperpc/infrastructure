services:
  # qBittorrent
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.1_v2.1.3-ls490
    container_name: qbittorrent
    profiles: [qbittorrent]
    labels:
      homepage.instance.private.group: Personal
      homepage.instance.private.name: qbittorrent
      homepage.instance.private.weight: "120"
      homepage.instance.private.icon: qbittorrent.png
      homepage.instance.private.href: https://torrent.${DOMAIN}/
      homepage.instance.private.description: qBittorrent
    extends:
      file: ../../../common.yml
      service: service-base
    env_file:
      - ./qbittorrent.env
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - ${LISTEN_ADDRESS:-0.0.0.0}:6881:6881
      - ${LISTEN_ADDRESS:-0.0.0.0}:6881:6881/udp
    volumes:
      - qbittorrent_config:/config
      - public_data:/downloads
      - private_data:/private_downloads
    networks:
      - qbittorrent
      - proxy-torrent

volumes:
  qbittorrent_config: { name: qbittorrent_config }

networks:
  qbittorrent: {}
